<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藏文字母 · 组词学习</title>
<style>
  :root{
    --green:#58cc02; --green-d:#46a302; --blue:#1cb0f6; --blue-d:#1899d6;
    --gray:#e5e5e5; --gray-d:#afafaf; --ink:#3c3c3c; --dim:#afafaf; --bg:#ffffff;
    --tib:'Microsoft Himalaya','Noto Serif Tibetan','Jomolhari',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:'Segoe UI','Microsoft YaHei',system-ui,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center}

  header{width:100%;max-width:680px;display:flex;align-items:center;gap:14px;padding:18px 20px 6px}
  .back{width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:var(--dim);
        font-size:22px;cursor:pointer;line-height:1;flex-shrink:0}
  .back:hover{background:#f4f4f4;color:var(--ink)}
  .pbar{flex:1;height:16px;background:var(--gray);border-radius:8px;overflow:hidden}
  .pbar i{display:block;height:100%;width:0;background:var(--green);border-radius:8px;transition:width .3s}
  .count{font-size:13px;color:var(--dim);font-weight:700;white-space:nowrap;min-width:44px;text-align:right}

  main{width:100%;max-width:680px;padding:10px 20px 120px;flex:1}
  h2{font-size:15px;font-weight:800;color:var(--dim);letter-spacing:1px;margin:26px 0 12px}

  /* 字母大卡片 */
  .hero{border:2px solid var(--gray);border-bottom-width:5px;border-radius:18px;padding:26px 20px 22px;
        text-align:center;cursor:pointer;transition:.1s;background:#fff;position:relative}
  .hero:hover{background:#fbfbfb}
  .hero:active{transform:translateY(2px);border-bottom-width:3px}
  .hero.playing{border-color:var(--green);background:#f3ffe4}
  .hero .glyph{font-family:var(--tib);font-size:120px;line-height:1;color:var(--ink)}
  .hero .wylie{font-size:26px;font-weight:800;color:var(--green);margin-top:6px;letter-spacing:1px}
  .hero .meta{font-size:14px;color:var(--dim);margin-top:4px}
  .hero .tap{position:absolute;right:14px;top:14px;font-size:12px;color:var(--dim);
             background:#f4f4f4;border-radius:20px;padding:3px 10px}
  .hero.playing .tap{background:var(--green);color:#fff}

  /* 组词 */
  .words{display:flex;flex-direction:column;gap:10px}
  .empty{border:2px dashed var(--gray);border-radius:16px;padding:22px 16px;text-align:center;
         color:var(--dim);font-size:14px;line-height:1.7}
  .word{display:flex;align-items:center;gap:14px;border:2px solid var(--gray);border-bottom-width:5px;
        border-radius:16px;padding:14px 16px;cursor:pointer;transition:.1s;background:#fff}
  .word:hover{background:#fbfbfb}
  .word:active{transform:translateY(2px);border-bottom-width:3px}
  .word.playing{border-color:var(--blue);background:#eaf7ff}
  .word .tw{font-family:var(--tib);font-size:40px;line-height:1;min-width:120px;color:var(--ink)}
  .word .info{flex:1;min-width:0}
  .word .wy{font-size:15px;font-weight:700;color:var(--blue)}
  .word .cn{font-size:13px;color:var(--dim);margin-top:2px}
  .word .spk{width:38px;height:38px;border-radius:50%;background:#f4f4f4;display:grid;place-content:center;
             font-size:17px;flex-shrink:0}
  .word.playing .spk{background:var(--blue);color:#fff}

  /* 底部导航 */
  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--gray);
      padding:14px 20px;display:flex;gap:12px;justify-content:center}
  nav .inner{width:100%;max-width:680px;display:flex;gap:12px}
  .btn{flex:1;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;font-family:inherit;
       cursor:pointer;letter-spacing:1px;transition:.1s}
  .btn.primary{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
  .btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
  .btn.ghost{background:#fff;color:var(--dim);border:2px solid var(--gray);box-shadow:0 4px 0 var(--gray)}
  .btn.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gray)}
  .btn:disabled{opacity:.45;box-shadow:none;cursor:default;transform:none}

  .strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .strip a{font-family:var(--tib);font-size:22px;line-height:1;text-decoration:none;color:var(--dim);
           padding:4px 8px;border-radius:8px}
  .strip a:hover{background:#f4f4f4;color:var(--ink)}
  .strip a.on{background:var(--green);color:#fff}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);background:var(--ink);
         color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;opacity:0;transition:.22s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <button class="back" id="back" title="返回字母表">✕</button>
  <div class="pbar"><i id="pbar"></i></div>
  <div class="count" id="count">1/30</div>
</header>

<main>
  <div class="hero" id="hero">
    <div class="tap" id="tap">点击听发音</div>
    <div class="glyph" id="glyph">ཀ</div>
    <div class="wylie" id="wylie">ka</div>
    <div class="meta" id="meta">[ka] · 卡</div>
  </div>

  <h2>组词 · 含此字母的词</h2>
  <div class="words" id="words"></div>

  <h2>跳到其他字母</h2>
  <div class="strip" id="strip"></div>
</main>

<nav>
  <div class="inner">
    <button class="btn ghost" id="prev">← 上一个</button>
    <button class="btn primary" id="next">下一个 →</button>
  </div>
</nav>

<div class="toast" id="toast"></div>

<script>
const LETTERS = [
  ["ka","ཀ","ka","ka","卡"],       ["kha","ཁ","kha","kʰa","卡（送气）"],
  ["ga","ག","ga","ɡa","嘎"],       ["nga","ང","nga","ŋa","阿（鼻音）"],
  ["ca","ཅ","ca","tɕa","加"],      ["cha","ཆ","cha","tɕʰa","加（送气）"],
  ["ja","ཇ","ja","dʑa","贾"],      ["nya","ཉ","nya","ɲa","尼亚"],
  ["ta","ཏ","ta","ta","达（不送气）"], ["tha","ཐ","tha","tʰa","塔"],
  ["da","ད","da","da","达"],       ["na","ན","na","na","纳"],
  ["pa","པ","pa","pa","巴（不送气）"], ["pha","ཕ","pha","pʰa","帕"],
  ["ba","བ","ba","ba","巴"],       ["ma","མ","ma","ma","玛"],
  ["tsa","ཙ","tsa","tsa","匝"],    ["tsha","ཚ","tsha","tsʰa","擦"],
  ["dza","ཛ","dza","dza","杂"],    ["wa","ཝ","wa","wa","瓦"],
  ["zha","ཞ","zha","ʑa","夏（浊）"], ["za","ཟ","za","za","萨（浊）"],
  ["aa","འ","'a","ʔa","阿（喉塞）"], ["ya","ཡ","ya","ja","亚"],
  ["ra","ར","ra","ra","惹"],       ["la","ལ","la","la","拉"],
  ["sha","ཤ","sha","ɕa","夏"],     ["sa","ས","sa","sa","萨"],
  ["ha","ཧ","ha","ha","哈"],       ["a","ཨ","a","a","阿"],
];

const $ = (id) => document.getElementById(id);
const toastEl = $('toast');
let toastTimer;
function toast(m, ms = 1800) {
  toastEl.textContent = m; toastEl.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), ms);
}

let WORDS = null;
let idx = 0;
const player = new Audio();
let curBtn = null;

function playEl(el, src) {
  document.querySelectorAll('.playing').forEach((e) => e.classList.remove('playing'));
  player.pause(); player.src = src; player.currentTime = 0;
  if (el) { el.classList.add('playing'); curBtn = el; }
  player.play().catch((e) => toast('播放失败：' + (e.message || e.name)));
}
player.onended = () => { if (curBtn) curBtn.classList.remove('playing'); };

function letterIndex() {
  const q = new URLSearchParams(location.search).get('id');
  if (q) { const i = LETTERS.findIndex((L) => L[0] === q); if (i >= 0) return i; }
  const h = Number(location.hash.replace('#', ''));
  return Number.isFinite(h) && h >= 0 && h < LETTERS.length ? h : 0;
}

function render(i, push = true) {
  idx = Math.max(0, Math.min(LETTERS.length - 1, i));
  const [id, tib, wylie, ipa, cn] = LETTERS[idx];
  if (push) history.replaceState(null, '', `?id=${id}`);

  $('glyph').textContent = tib;
  $('wylie').textContent = wylie;
  $('meta').textContent = `[${ipa}] · ${cn}`;
  $('count').textContent = `${idx + 1}/${LETTERS.length}`;
  $('pbar').style.width = `${(idx + 1) / LETTERS.length * 100}%`;
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === LETTERS.length - 1;

  // 跳到其他字母
  const strip = $('strip');
  strip.innerHTML = '';
  LETTERS.forEach((L, k) => {
    const a = document.createElement('a');
    a.textContent = L[1];
    a.href = `?id=${L[0]}`;
    if (k === idx) a.className = 'on';
    a.onclick = (e) => { e.preventDefault(); render(k); playEl(null, `audio-real/${L[0]}.wav`); };
    strip.appendChild(a);
  });

  // 组词
  const box = $('words');
  box.innerHTML = '';
  const entry = WORDS && WORDS.letters.find((l) => l.id === id);
  if (!entry || !entry.words.length) {
    box.innerHTML = '<div class="empty">该字母暂无组词 —— 视频里没有收录，先记住它的读音吧 🔊</div>';
    return;
  }
  entry.words.forEach((w, k) => {
    const el = document.createElement('div');
    el.className = 'word';
    el.innerHTML =
      `<div class="tw">${w.tib}</div>` +
      `<div class="info"><div class="wy">${w.wylie}</div><div class="cn">${w.cn}</div></div>` +
      `<div class="spk">🔊</div>`;
    el.onclick = () => playEl(el, `audio-words/${id}/${k}.wav`);
    box.appendChild(el);
  });
}

$('hero').onclick = () => { const [id] = LETTERS[idx]; playEl($('hero'), `audio-real/${id}.wav`); };
$('prev').onclick = () => { render(idx - 1); };
$('next').onclick = () => { render(idx + 1); };
$('back').onclick = () => { location.href = './'; };

addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft') render(idx - 1);
  else if (e.code === 'ArrowRight') render(idx + 1);
  else if (e.code === 'Space') { e.preventDefault(); const [id] = LETTERS[idx]; playEl($('hero'), `audio-real/${id}.wav`); }
});

fetch('words.json').then((r) => r.json()).then((j) => {
  WORDS = j;
  render(letterIndex(), false);
}).catch(() => {
  toast('词表加载失败');
  render(letterIndex(), false);
});
</script>
</body>
</html>

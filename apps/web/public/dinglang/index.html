<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DingLang 在线编辑器</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2128; --fg: #e6edf3;
    --dim: #8b949e; --accent: #58a6ff; --green: #3fb950; --red: #f85149;
    --purple: #d2a8ff; --yellow: #d29922; --border: #30363d;
    /* 编辑区字体：pre 和 textarea 必须完全一致，否则高亮会错位 */
    --codefont: "Cascadia Code", Consolas, "SF Mono", Menlo,
                "Microsoft Himalaya", "Noto Sans Tibetan", monospace;
    --tib: "Microsoft Himalaya", "Jomolhari", "Noto Sans Tibetan";
    /* 字号统一在这里调 */
    --fs-code: 15px;      /* 编辑器里的代码 */
    --lh-code: 1.7;
    --fs-ui: 15px;        /* 按钮、下拉 */
    --fs-tab: 14.5px;     /* 标签页 */
    --fs-out: 16px;       /* 输出区 */
    --fs-side: 14.5px;    /* 文件列表 */
    --pad-y: 15px;
    --pad-x: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    /* ★ 用 flex 竖排，取代 calc(100% - 55px) 那种魔法数字。
       之前 header 从 55px 变成 63px，那个减法没跟着改，底部状态栏就被切掉了。 */
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: var(--tib), -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: var(--fs-ui);
  }

  /* ── 顶栏 ── */
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 13px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .logo { font-size: 21px; font-weight: 600; letter-spacing: -0.3px; }
  .logo .ver { font-size: 12px; color: var(--accent); border: 1px solid var(--accent);
               border-radius: 8px; padding: 1px 8px; margin-left: 7px; vertical-align: middle;
               font-family: var(--codefont); }
  .spacer { flex: 1; }
  select, button, .reflink {
    font-family: inherit; font-size: var(--fs-ui); padding: 8px 15px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--fg);
    cursor: pointer; transition: all .15s;
  }
  select:hover, button:hover, .reflink:hover { border-color: var(--accent); text-decoration: none; }
  .reflink { color: var(--accent); border-color: rgba(88,166,255,.35); }
  button.primary { background: #238636; border-color: #2ea043; font-weight: 600; }
  button.primary:hover { background: #2ea043; }
  button.primary:disabled { opacity: .5; cursor: wait; }
  kbd { font-family: var(--codefont); font-size: 12px; background: rgba(255,255,255,.1);
        padding: 1px 6px; border-radius: 4px; margin-left: 6px; }

  /* ── 桌面版：文件浏览器侧栏 ── */
  #sidebar {
    display: none; width: 218px; flex-shrink: 0; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  body.desktop #sidebar { display: flex; }
  .sb-head {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .sb-head .ttl { font-size: 13px; color: var(--dim); flex: 1;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                  font-family: var(--codefont); }
  .sb-head button { padding: 4px 10px; font-size: 13px; }
  .sb-path {
    padding: 6px 12px; font-size: 12.5px; color: #484f58; font-family: var(--codefont);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left;
  }
  .sb-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .sb-item {
    display: flex; align-items: center; gap: 7px; padding: 4px 10px 4px 12px;
    font-size: var(--fs-side); cursor: pointer; color: var(--fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sb-item:hover { background: var(--panel2); }
  .sb-item.active { background: rgba(88,166,255,.14); color: var(--accent); }
  .sb-item .ico { flex-shrink: 0; font-size: 14px; opacity: .85; }
  .sb-item .sz { margin-left: auto; font-size: 11.5px; color: #484f58; font-family: var(--codefont); }
  .sb-item.dir { color: var(--dim); }
  .sb-empty { padding: 14px 12px; font-size: 13px; color: #484f58; }
  /* 换目录的输入框 */
  .sb-edit { padding: 6px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .sb-edit input {
    width: 100%; font-family: var(--codefont); font-size: 11.5px;
    padding: 5px 8px; border-radius: 4px; border: 1px solid var(--accent);
    background: var(--bg); color: var(--fg); outline: none;
  }
  .sb-foot { padding: 7px 10px; border-top: 1px solid var(--border); flex-shrink: 0; display: flex; gap: 6px; }
  .sb-foot button { flex: 1; padding: 6px 0; font-size: var(--fs-side); }
  .dirty { color: var(--yellow); font-size: 12px; margin-left: 5px; }

  /* ── 主体：flex 撑满剩余高度，没有魔法数字 ── */
  main { display: flex; flex: 1 1 auto; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .pane + .pane { border-left: 1px solid var(--border); }

  .pane-head {
    display: flex; align-items: center; gap: 4px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .tab { font-size: var(--fs-tab); padding: 6px 14px; border-radius: 6px; cursor: pointer;
         color: var(--dim); border: none; background: none; font-family: inherit; }
  .tab:hover { background: var(--panel2); color: var(--fg); }
  .tab.active { background: var(--panel2); color: var(--accent); font-weight: 600; }
  .pane-head .right { margin-left: auto; font-size: 13px; color: var(--dim); font-family: var(--codefont); }

  /* ── 编辑器：textarea 叠在高亮层上面 ── */
  .editor-wrap { flex: 1; display: flex; overflow: hidden; position: relative; }
  .gutter {
    flex-shrink: 0; padding: var(--pad-y) 10px var(--pad-y) 16px; text-align: right;
    font-family: var(--codefont); font-size: var(--fs-code); line-height: var(--lh-code);
    color: #484f58; background: var(--panel); user-select: none; overflow: hidden;
    border-right: 1px solid var(--border);
    white-space: pre;   /* 必须！否则行号的换行会被折叠成空格 */
  }
  .code-area { flex: 1; position: relative; overflow: hidden; }

  .hl, #code {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    margin: 0; border: 0; outline: none;
    padding: var(--pad-y) var(--pad-x);
    font-family: var(--codefont); font-size: var(--fs-code); line-height: var(--lh-code);
    white-space: pre; tab-size: 2; word-wrap: normal; overflow-wrap: normal;
    overflow: auto;
  }
  .hl {
    z-index: 1; pointer-events: none; color: var(--fg);
    background: var(--bg);
  }
  #code {
    z-index: 2; resize: none; background: transparent;
    color: transparent;            /* 文字透明，只留光标 */
    caret-color: var(--fg);
  }
  #code::selection { background: rgba(88,166,255,.32); }
  /* 高亮层的光标也要跟着显示出来（否则选中的字看不见） */
  #code::selection { color: transparent; }

  /* ── 语法配色 ── */
  .c-com  { color: #6e7681; font-style: italic; }
  .c-str  { color: #7ee787; }
  .c-num  { color: #ffa657; }
  .c-kw   { color: #ff7b72; font-weight: 600; }
  .c-bi   { color: #79c0ff; }
  .c-op   { color: #ff7b72; }
  .c-pun  { color: #8b949e; }
  .c-id   { color: #e6edf3; }
  .c-id.tib, .c-str.tib { color: var(--purple); }

  /* ── 输出区 ── */
  .out {
    flex: 1; overflow: auto; padding: var(--pad-y) 18px;
    font-family: var(--tib), var(--codefont); font-size: var(--fs-out); line-height: 1.9;
    white-space: pre-wrap; word-break: break-word;
  }
  .out.mono { font-family: var(--codefont); font-size: 14px; line-height: 1.65; }
  .out .empty { color: var(--dim); font-style: italic; }

  .errbox .head { color: var(--red); font-weight: 600; margin-bottom: 6px; }
  .errbox .msg { color: var(--fg); margin-bottom: 12px; font-family: var(--tib), sans-serif;
                 font-size: var(--fs-out); white-space: pre-wrap; line-height: 1.75; }
  .errbox .code { font-family: var(--codefont); font-size: 14px; line-height: 1.7;
                  background: var(--panel); border-radius: 8px; padding: 10px 14px;
                  border: 1px solid var(--border); overflow-x: auto; white-space: pre; }
  .errbox .code .ln { color: #484f58; user-select: none; display: inline-block;
                      width: 2.4em; text-align: right; margin-right: 12px; }
  .errbox .code .bad { background: rgba(248,81,73,.15); border-radius: 3px; }
  .errbox .code .caret { color: var(--red); }

  .status {
    padding: 7px 16px; font-size: 13px; font-family: var(--codefont); color: var(--dim);
    border-top: 1px solid var(--border); background: var(--panel); flex-shrink: 0;
    display: flex; gap: 14px;
  }
  .status .live { color: var(--green); }

  @media (max-width: 760px) {
    main { flex-direction: column; }
    .pane { flex: 1 1 0; min-height: 0; }
    .pane + .pane { border-left: none; border-top: 1px solid var(--border); }
    header { gap: 8px; padding: 10px 14px; }
    .logo { font-size: 18px; }
    .logo .ver { display: none; }
    .reflink { padding: 7px 11px; }
  }

  /* 中等宽度：收紧顶栏，别让它换行把内容挤下去 */
  @media (max-width: 1180px) {
    header { gap: 10px; padding: 11px 16px; }
    .reflink { padding: 7px 12px; }
  }
  /* 示例下拉别把「运行」按钮挤走 */
  #examples {
    max-width: 420px; min-width: 120px;
    overflow: hidden; text-overflow: ellipsis;
  }
  @media (max-width: 1000px) { #examples { max-width: 260px; } }
  @media (max-width: 860px)  { #examples { max-width: 180px; } }

  /* 活动栏：只在桌面版显示 */
  .activitybar { display: none; }

  /* ══════════════════════════════════════════════════════════
     VS Code 风格 —— 只作用于桌面版（body.desktop）
     网页版保持原来清爽的样子，两者互不影响
     ══════════════════════════════════════════════════════════ */
  body.desktop {
    /* VS Code Dark+ 配色 */
    --bg: #1e1e1e;
    --panel: #252526;
    --panel2: #2d2d30;
    --fg: #d4d4d4;
    --dim: #858585;
    --accent: #0098ff;
    --green: #89d185;
    --red: #f48771;
    --yellow: #cca700;
    --purple: #c586c0;
    --border: #3c3c3c;
    --vscode-blue: #007acc;
    --vscode-act: #333333;
    --vscode-tab: #2d2d2d;
    font-family: "Segoe UI", "Microsoft YaHei", var(--tib), sans-serif;
    font-size: 13px;
  }

  /* 顶栏 → 像 VS Code 的编辑器工具条：紧凑、深色 */
  body.desktop header {
    padding: 6px 12px; gap: 10px; background: var(--vscode-tab);
    border-bottom: 1px solid var(--border); min-height: 0;
  }
  body.desktop .logo { font-size: 14px; font-weight: 600; color: var(--fg); }
  body.desktop .logo .ver { font-size: 10px; padding: 0 5px; border-color: #555; color: var(--dim); }
  body.desktop select,
  body.desktop button,
  body.desktop .reflink {
    font-size: 12.5px; padding: 4px 10px; border-radius: 3px;
    background: #3a3d41; border-color: #3a3d41; color: var(--fg);
  }
  body.desktop select:hover, body.desktop button:hover, body.desktop .reflink:hover {
    background: #45494e; border-color: #45494e;
  }
  body.desktop button.primary {
    background: var(--vscode-blue); border-color: var(--vscode-blue); color: #fff;
  }
  body.desktop button.primary:hover { background: #1a8ad4; }
  body.desktop kbd { display: none; }

  /* ── 主体：CSS Grid 摆成 VS Code 的三栏两行 ── */
  body.desktop main {
    display: grid;
    grid-template-columns: 48px 250px minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) minmax(120px, 34%);
    grid-template-areas:
      "act side editor"
      "act side panel";
  }
  body.desktop .activitybar { grid-area: act; }
  body.desktop #sidebar     { grid-area: side; }
  body.desktop #editorpane  { grid-area: editor; }
  body.desktop #outpane     { grid-area: panel; }

  /* ── 活动栏 ── */
  body.desktop .activitybar {
    display: flex; flex-direction: column; align-items: center;
    background: var(--vscode-act); border-right: 1px solid var(--border);
    padding: 4px 0; gap: 2px;
  }
  body.desktop .act {
    width: 48px; height: 42px; padding: 0; border: none; border-radius: 0;
    background: none; color: #858585; font-size: 19px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    border-left: 2px solid transparent; cursor: pointer;
  }
  body.desktop .act:hover { color: #fff; background: none; border-color: transparent; }
  body.desktop .act.act-on { color: #fff; border-left-color: #fff; }

  /* ── 侧边栏：VS Code 的资源管理器 ── */
  body.desktop #sidebar {
    width: auto; background: var(--panel); border-right: 1px solid var(--border);
  }
  body.desktop .sb-head {
    padding: 8px 12px 6px; border-bottom: none;
    font-size: 11px; letter-spacing: 0.6px; text-transform: uppercase;
    color: #bbbbbb; font-weight: 600;
  }
  body.desktop .sb-head .ttl { font-size: 11px; letter-spacing: 0.6px; text-transform: uppercase; color: #bbbbbb; }
  body.desktop .sb-head button {
    background: none; border: none; color: #cccccc; font-size: 14px; padding: 0 4px;
  }
  body.desktop .sb-head button:hover { background: #ffffff1a; }
  body.desktop .sb-path {
    padding: 3px 12px 6px; font-size: 11px; color: #8a8a8a;
    border-bottom: none; font-family: var(--codefont);
  }
  body.desktop .sb-list { padding: 2px 0 6px; }
  body.desktop .sb-item {
    padding: 3px 10px 3px 20px; font-size: 13px; border-radius: 0;
    color: #cccccc;
  }
  body.desktop .sb-item:hover { background: #2a2d2e; }
  body.desktop .sb-item.active { background: #37373d; color: #fff; }
  body.desktop .sb-item .ico { font-size: 13px; }
  body.desktop .sb-item .sz { font-size: 10.5px; color: #6e6e6e; }
  body.desktop .sb-foot { padding: 6px 8px; border-top: 1px solid var(--border); gap: 4px; }
  body.desktop .sb-foot button {
    background: #3a3d41; border: none; font-size: 12px; padding: 5px 0;
  }
  body.desktop .sb-foot button:hover { background: #45494e; }

  /* ── 编辑器：像 VS Code 的标签页 ── */
  body.desktop #editorpane { border-right: none; }
  body.desktop .pane-head {
    padding: 0; background: var(--vscode-tab); border-bottom: 1px solid var(--border);
    min-height: 35px;
  }
  body.desktop .pane-head .tab {
    padding: 0 16px; height: 35px; border-radius: 0; font-size: 13px;
    background: var(--vscode-tab); color: #969696;
    border-right: 1px solid var(--border); border-top: 1px solid transparent;
  }
  body.desktop .pane-head .tab:hover { background: var(--vscode-tab); color: #fff; }
  body.desktop .pane-head .tab.active {
    background: var(--bg); color: #fff; font-weight: 400;
    border-top-color: var(--vscode-blue);
  }
  body.desktop .pane-head .right { padding-right: 12px; font-size: 12px; color: #8a8a8a; }

  /* 底部面板：也是标签页样式 */
  body.desktop #outpane { border-top: 1px solid var(--border); }
  body.desktop #outpane .pane-head { min-height: 32px; }
  body.desktop #outpane .tab {
    height: 32px; padding: 0 13px; font-size: 12px; letter-spacing: 0.4px;
    text-transform: uppercase; border-top: none; border-bottom: 1px solid transparent;
  }
  body.desktop #outpane .tab.active {
    background: var(--vscode-tab); border-bottom-color: var(--vscode-blue);
    border-top: none;
  }

  /* ── 语法配色改成 VS Code Dark+ ── */
  body.desktop .c-com { color: #6a9955; font-style: normal; }
  body.desktop .c-str { color: #ce9178; }
  body.desktop .c-num { color: #b5cea8; }
  body.desktop .c-kw  { color: #569cd6; font-weight: 400; }
  body.desktop .c-bi  { color: #dcdcaa; }
  body.desktop .c-op  { color: #d4d4d4; }
  body.desktop .c-pun { color: #808080; }
  body.desktop .c-id  { color: #d4d4d4; }
  body.desktop .c-id.tib, body.desktop .c-str.tib { color: #c586c0; }

  /* ── 状态栏：VS Code 的蓝色 ── */
  body.desktop .status {
    background: var(--vscode-blue); color: #fff; border-top: none;
    padding: 0 12px; height: 24px; align-items: center;
    font-size: 12px; font-family: "Segoe UI", sans-serif; gap: 16px;
  }
  body.desktop .status .live { color: #fff; }
  body.desktop .status .st-right { margin-left: auto; color: #ffffffcc; }

  /* 滚动条也模仿 VS Code */
  body.desktop ::-webkit-scrollbar { width: 14px; height: 14px; }
  body.desktop ::-webkit-scrollbar-track { background: transparent; }
  body.desktop ::-webkit-scrollbar-thumb {
    background: #424242; border: 3px solid var(--bg); border-radius: 8px;
  }
  body.desktop ::-webkit-scrollbar-thumb:hover { background: #4f4f4f; }
  body.desktop ::-webkit-scrollbar-corner { background: transparent; }
</style>
</head>
<body>

<header>
  <div class="logo">DingLang<span class="ver">v0.1</span></div>
  <a class="reflink" href="reference.html" title="语法、数字、函数完整参考">📖 参考手册</a>
  <select id="examples" title="选择示例"></select>
  <div class="spacer"></div>
  <button id="clear">清空</button>
  <button id="run" class="primary">▶ 运行<kbd>Ctrl</kbd><kbd>↵</kbd></button>
</header>

<main>
  <!-- VS Code 风格的活动栏（只有桌面版显示）-->
  <div class="activitybar" id="activitybar">
    <button class="act act-on" data-panel="files" title="资源管理器">🗂</button>
    <button class="act" data-panel="run" title="运行 (Ctrl+Enter)">▶</button>
    <button class="act" data-panel="ref" title="参考手册">📖</button>
  </div>

  <!-- 桌面版才有：本地文件浏览器 -->
  <aside id="sidebar">
    <div class="sb-head">
      <span class="ttl">本地文件</span>
      <button id="sb-up" title="上一级">↑</button>
      <button id="sb-refresh" title="刷新">⟳</button>
    </div>
    <div class="sb-path" id="sb-path" title="点这里可以换目录（粘贴一个完整路径）">—</div>
    <div class="sb-edit" id="sb-edit" style="display:none">
      <input id="sb-input" placeholder="粘贴一个完整路径，回车切换">
    </div>
    <div class="sb-list" id="sb-list"></div>
    <div class="sb-foot">
      <button id="sb-new" title="在当前目录新建 .ding 文件">新建</button>
      <button id="sb-saveas" title="另存为">另存为</button>
    </div>
  </aside>

  <div class="pane" id="editorpane">
    <div class="pane-head">
      <button class="tab active">源码</button>
      <span class="right" id="srcinfo"></span>
    </div>
    <div class="editor-wrap">
      <div class="gutter" id="gutter">1</div>
      <div class="code-area">
        <pre class="hl" id="hl" aria-hidden="true"></pre>
        <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off"
                  autocorrect="off" wrap="off"></textarea>
      </div>
    </div>
  </div>

  <div class="pane" id="outpane">
    <div class="pane-head">
      <button class="tab active" data-tab="out">输出</button>
      <button class="tab" data-tab="js">生成的 JavaScript</button>
      <button class="tab" data-tab="ast">语法树</button>
      <span class="right" id="outinfo"></span>
    </div>
    <div class="out" id="out"></div>
  </div>
</main>

<!-- 状态栏：全宽，VS Code 里也是贯穿底部的 -->
<div class="status" id="statusbar">
  <span id="st-status">就绪</span>
  <span id="st-time"></span>
  <span id="st-lines"></span>
  <span class="st-right" id="st-right"></span>
</div>

<script src="compiler.js"></script>
<script src="highlight.js"></script>
<script src="examples.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var codeEl = $('code'), hlEl = $('hl'), gutter = $('gutter'), outEl = $('out');
  var exSel = $('examples'), runBtn = $('run');
  var curTab = 'out';
  var lastResult = null;
  var worker = null, seq = 0, running = false, timer = null;
  var TIMEOUT_MS = 4000;

  // ── 高亮 + 行号 ──
  var hlPending = false;
  function paint() {
    if (hlPending) return;
    hlPending = true;
    requestAnimationFrame(function () {
      hlPending = false;
      var src = codeEl.value;
      hlEl.innerHTML = window.DingHighlight
        ? window.DingHighlight.highlight(src)
        : src.replace(/[&<>]/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]; });
      var n = src.split('\n').length;
      var s = '';
      for (var i = 1; i <= n; i++) s += i + '\n';
      gutter.textContent = s;
      $('srcinfo').textContent = n + ' 行 · ' + src.length + ' 字符';
      syncScroll();
    });
  }
  function syncScroll() {
    hlEl.scrollTop = codeEl.scrollTop;
    hlEl.scrollLeft = codeEl.scrollLeft;
    gutter.scrollTop = codeEl.scrollTop;
  }
  codeEl.addEventListener('input', paint);
  codeEl.addEventListener('scroll', syncScroll);

  // Tab 插两个空格
  codeEl.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var s = codeEl.selectionStart, en = codeEl.selectionEnd;
      codeEl.value = codeEl.value.slice(0, s) + '  ' + codeEl.value.slice(en);
      codeEl.selectionStart = codeEl.selectionEnd = s + 2;
      paint();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
  });

  // ── Worker（超时保护，防死循环卡页面）──
  function newWorker() {
    var w = new Worker('runner.js');
    w.onmessage = onWorkerMessage;
    w.onerror = function (e) { finish(false, '执行器出错: ' + (e.message || '未知错误')); };
    return w;
  }
  function killWorker() {
    if (worker) { worker.terminate(); worker = null; }
    if (timer) { clearTimeout(timer); timer = null; }
  }

  function onWorkerMessage(e) {
    var d = e.data;
    if (d.id !== seq) return;
    killWorker();
    if (d.ok) finish(true, null, d.output, d.code);
    else if (d.phase === 'compile') finish(false, null, null, null, d.error);
    else finish(false, null, d.output, d.code, d.error);
  }

  function run() {
    if (running) return;
    var src = codeEl.value;
    if (!src.trim()) { renderEmpty('（代码是空的）'); return; }

    killWorker();
    worker = newWorker();
    running = true; seq++;
    runBtn.disabled = true;
    $('st-status').textContent = '运行中…';
    $('st-time').textContent = '';
    var t0 = performance.now();
    worker.postMessage({ id: seq, src: src });

    timer = setTimeout(function () {
      var w = worker; killWorker(); if (w) w.terminate();
      running = false; runBtn.disabled = false; lastResult = null;
      var sec = (TIMEOUT_MS / 1000).toFixed(0);
      outEl.className = 'out';
      outEl.innerHTML = '<div class="errbox"><div class="head">✗ 执行超时</div>' +
        '<div class="msg">程序跑了超过 ' + sec + ' 秒还没结束，已经强制中止。' +
        '最常见的原因是死循环，比如 <code>while true { }</code> 或者循环变量没有变化。</div></div>';
      $('st-status').textContent = '已中止（超时）';
      $('st-time').textContent = sec + 's';
      curTab = 'out'; syncTabs();
    }, TIMEOUT_MS);

    run._done = function () {
      running = false; runBtn.disabled = false;
      $('st-time').textContent = (performance.now() - t0).toFixed(0) + ' ms';
    };
  }

  function finish(ok, msg, output, code, err) {
    if (run._done) run._done();
    lastResult = { output: output || [], code: code || null };
    if (ok) {
      $('st-status').innerHTML = '<span class="live">✓ 运行成功</span>';
      if (curTab === 'out') renderOutput(output || []);
    } else if (err) {
      $('st-status').textContent = err.line ? '✗ 第 ' + err.line + ' 行出错' : '✗ 运行出错';
      if (curTab === 'out') renderError(err, code);
    } else {
      $('st-status').textContent = '✗ ' + (msg || '出错');
      outEl.innerHTML = '<div class="errbox"><div class="head">✗</div><div class="msg">' + esc(msg) + '</div></div>';
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m];
    });
  }
  function renderEmpty(t) { outEl.className = 'out'; outEl.innerHTML = '<div class="empty">' + esc(t) + '</div>'; }
  function renderOutput(lines) {
    outEl.className = 'out';
    if (!lines.length) { renderEmpty('（程序没有输出）'); return; }
    outEl.innerHTML = lines.map(esc).join('\n');
  }

  function renderError(err, code) {
    outEl.className = 'out';
    var h = '<div class="errbox">';
    h += '<div class="head">✗ ' +
         (err.line ? '第 ' + err.line + ' 行' + (err.col ? ' 第 ' + err.col + ' 列' : '') : '运行出错') + '</div>';
    h += '<div class="msg">' + esc(err.message) + '</div>';
    // 用源码展示出错位置
    if (err.line) {
      var srcLines = codeEl.value.split('\n');
      var sl = srcLines[err.line - 1];
      if (sl !== undefined) {
        h += '<div class="code">' +
             '<div class="bad"><span class="ln">' + err.line + '</span>' + esc(sl) + '</div>' +
             '<div><span class="ln"></span>' +
             '<span class="caret">' + ' '.repeat(Math.max(0, (err.col || 1) - 1)) + '^</span></div>' +
             '</div>';
      }
    }
    // 编译错误没有生成代码；运行时错误额外展示生成的 JS 片段
    if (!err.line && code) {
      var lines = String(code).split('\n');
      h += '<div class="code">';
      lines.slice(0, Math.min(12, lines.length)).forEach(function (l, i) {
        h += '<div><span class="ln">' + (i + 1) + '</span>' + esc(l) + '</div>';
      });
      if (lines.length > 12) h += '<div><span class="ln"></span>…</div>';
      h += '</div>';
    }
    h += '</div>';
    outEl.innerHTML = h;
  }

  // ── Tab 切换 ──
  function syncTabs() {
    var tabs = document.querySelectorAll('.tab[data-tab]');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('active', tabs[i].dataset.tab === curTab);

    if (curTab === 'out') {
      outEl.className = 'out';
      if (lastResult) renderOutput(lastResult.output);
      $('outinfo').textContent = '';
      return;
    }
    outEl.className = 'out mono';
    try {
      if (curTab === 'js') {
        var r = DingLang.compile(codeEl.value, '<编辑器>');
        outEl.textContent = r.code;
        $('outinfo').textContent = r.code.split('\n').length + ' 行';
      } else {
        outEl.textContent = JSON.stringify(DingLang.parse(codeEl.value, '<编辑器>'), null, 2);
        $('outinfo').textContent = '原生 AST';
      }
    } catch (e) {
      outEl.className = 'out';
      var d = e.dingError;
      renderError({ message: e.message, line: d && d.line, col: d && d.col }, null);
      $('outinfo').textContent = '';
    }
  }
  document.querySelectorAll('.tab[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () { curTab = b.dataset.tab; syncTabs(); });
  });

  // ── 示例 ──
  var exs = (window.DING_EXAMPLES || []).slice();

  // ── 桌面版状态（要在示例填充之前定义，因为 rebuildExamples 会读它）──
  var FS = {
    active: false,   // 是否连着本地文件 API
    cwd: '.',
    rel: '.',
    file: null,      // 当前打开的文件（相对路径）—— 从文件浏览器打开的
    label: '未命名',  // 从示例加载时的显示名
    dirty: false,
  };

  /** 重建下拉框；桌面模式下才显示「需要文件系统」的示例 */
  function rebuildExamples() {
    var keep = exSel.value;
    exSel.innerHTML = '';
    var shown = 0;
    exs.forEach(function (ex) {
      if (ex.desktopOnly && !FS.active) return;   // 浏览器里藏起来，免得跑出「不支持」的报错
      var o = document.createElement('option');
      o.value = ex.id;
      o.textContent = ex.name + (ex.desktopOnly ? ' ←桌面版' : '') + ' —— ' + ex.desc;
      exSel.appendChild(o);
      shown++;
    });
    if (keep && exs.some(function (x) { return x.id === keep && (!x.desktopOnly || FS.active); })) {
      exSel.value = keep;
    }
  }

  exSel.addEventListener('change', function () {
    var ex = exs.filter(function (x) { return x.id === exSel.value; })[0];
    if (ex) {
      codeEl.value = ex.code;
      FS.file = null;                 // 从示例加载的，不是磁盘上的文件
      FS.label = ex.name.replace(/^★\s*/, '');
      setDirty(false);
      paint();
      updateEditorTab();
      run();
    }
  });

  $('run').addEventListener('click', run);
  $('clear').addEventListener('click', function () {
    codeEl.value = ''; paint(); renderEmpty('（代码是空的）');
    $('st-status').textContent = '就绪'; $('st-time').textContent = '';
    codeEl.focus();
  });

  // 先按「网页版」填一遍下拉框（会隐藏需要文件系统的示例），
  // 探测到桌面版 API 后会再填一遍，把那些示例放出来。
  FS.active = false;
  rebuildExamples();
  if (exs.length) {
    codeEl.value = exs[0].code;
    exSel.value = exs[0].id;
  }
  paint();
  renderEmpty('点右上角「运行」或按 Ctrl+Enter 执行代码');
  setTimeout(run, 250);

  // ══════════════════════════════════════════════════════
  //  桌面版：本地文件浏览器
  //  只有通过 desktop/server.js 打开时才会激活（检测 /api/cwd）
  // ══════════════════════════════════════════════════════

  function api(p, opt) {
    return fetch('/api' + p, opt).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  function setDirty(v) {
    FS.dirty = v;
    updateEditorTab();
  }

  /** 编辑器标签页文字：桌面版显示文件名，网页版显示「源码」 */
  function updateEditorTab() {
    var t = document.querySelector('#editorpane .tab');
    if (!t) return;
    if (document.body.classList.contains('desktop')) {
      var name = FS.file ? FS.file.split('/').pop() : (FS.label || '未命名') + '.ding';
      t.textContent = name + (FS.dirty ? ' ●' : '') + '  ✕';
    } else {
      t.textContent = '源码' + (FS.dirty ? ' ●' : '');
    }
  }

  /** 状态栏右侧：语言 / 编码 / 行列号（VS Code 那种）*/
  function updateStatusBar() {
    var right = $('st-right');
    if (!right) return;
    if (!document.body.classList.contains('desktop')) { right.textContent = ''; return; }
    var src = codeEl.value;
    var upto = src.slice(0, codeEl.selectionStart);
    var line = upto.split('\n').length;
    var col = upto.length - upto.lastIndexOf('\n');
    right.textContent = 'DingLang   UTF-8   Ln ' + line + ', Col ' + col;
    $('st-lines').textContent = src.split('\n').length + ' 行 · ' + src.length + ' 字符';
  }

  function renderFileList(data) {
    var box = $('sb-list');
    box.innerHTML = '';
    FS.rel = data.path;
    $('sb-path').textContent = data.abs;
    if (!data.entries.length) {
      box.innerHTML = '<div class="sb-empty">（空目录）</div>';
      return;
    }
    data.entries.forEach(function (e) {
      var el = document.createElement('div');
      el.className = 'sb-item' + (e.dir ? ' dir' : '');
      var icon = e.dir ? '📁' : (e.name.endsWith('.ding') ? '📘' : '📄');
      var size = e.dir ? '' : (e.size < 1024 ? e.size + ' B' : (e.size / 1024).toFixed(1) + ' K');
      el.innerHTML = '<span class="ico">' + icon + '</span><span class="nm"></span>' +
                     '<span class="sz">' + size + '</span>';
      el.querySelector('.nm').textContent = e.name;
      var child = (FS.rel === '.' ? '' : FS.rel + '/') + e.name;
      if (e.dir) {
        el.onclick = function () { loadDir(child); };
      } else {
        if (child === FS.file) el.classList.add('active');
        el.onclick = function () { openFile(child); };
      }
      box.appendChild(el);
    });
  }

  function loadDir(p) {
    api('/list?path=' + encodeURIComponent(p || '.'))
      .then(renderFileList)
      .catch(function (e) { $('sb-list').innerHTML = '<div class="sb-empty">读取失败：' + esc(e.message) + '</div>'; });
  }

  function openFile(p) {
    if (FS.dirty && !confirm('当前文件有未保存的修改，确定要切换吗？')) return;
    api('/read?path=' + encodeURIComponent(p)).then(function (d) {
      codeEl.value = d.content;
      FS.file = p;
      FS.label = null;
      setDirty(false);
      paint();
      updateEditorTab();
      $('st-status').textContent = '已打开 ' + p;
      loadDir(FS.rel);
      run();
    }).catch(function (e) { alert('打开失败：' + e.message); });
  }

  function saveFile(as) {
    var p = FS.file;
    if (as || !p) {
      p = prompt('保存为（相对路径，比如 我的程序.ding）', p || '未命名.ding');
      if (!p) return;
    }
    api('/write', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: p, content: codeEl.value }),
    }).then(function () {
      FS.file = p;
      setDirty(false);
      $('st-status').textContent = '已保存 ' + p;
      loadDir(FS.rel);
    }).catch(function (e) { alert('保存失败：' + e.message); });
  }

  // ── 给原生菜单（桌面版）调用的接口 ──
  window.__save = function (as) { if (FS.active) saveFile(!!as); };
  window.__run = function () { run(); };
  window.__newFile = function () { $('sb-new').click(); };

  // Ctrl+S 保存
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      if (FS.active) saveFile(false);
    }
  });
  // 改动标记
  codeEl.addEventListener('input', function () { if (FS.active) setDirty(true); });

  // 探测桌面版 API
  api('/cwd').then(function (d) {
    FS.active = true;
    FS.cwd = d.cwd;
    document.body.classList.add('desktop');
    rebuildExamples();          // 桌面模式：把「需要文件系统」的示例也放出来
    loadDir('.');
    // 桌面模式下默认切到「读本地文件」那个示例 —— 这才展示了桌面版的能力
    var f = exs.filter(function (x) { return x.id === 'tibFile'; })[0];
    if (f) {
      exSel.value = f.id;
      codeEl.value = f.code;
      FS.file = null;
      FS.label = f.name.replace(/^★\s*/, '');
      setDirty(false);
      paint();
      run();
    }
    // ⚠️ 这两个必须在加上 desktop 类之后调 ——
    //    它们内部会判断 body 有没有 desktop 来决定显示文件名还是「源码」
    updateEditorTab();
    updateStatusBar();
    $('st-status').textContent = '桌面版 · ' + d.cwd;
  }).catch(function () {
    // 网页版：没有文件 API，侧栏保持隐藏
    FS.active = false;
    rebuildExamples();
  });

  $('sb-refresh').onclick = function () { loadDir(FS.rel); };

  // ── 换工作目录：点路径那一行就变成输入框 ──
  //    （浏览器里拿不到系统文件对话框的路径，所以让用户自己粘贴）
  var sbPath = $('sb-path'), sbEdit = $('sb-edit'), sbInput = $('sb-input');

  function openPathEditor() {
    if (!FS.active) return;
    sbInput.value = FS.cwd || '';
    sbPath.style.display = 'none';
    sbEdit.style.display = '';
    sbInput.focus();
    sbInput.select();
  }
  function closePathEditor() {
    sbEdit.style.display = 'none';
    sbPath.style.display = '';
  }
  function applyPathEditor() {
    var p = sbInput.value.trim();
    if (!p) return closePathEditor();
    api('/cwd', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: p }),
    }).then(function (d) {
      FS.cwd = d.cwd;
      FS.file = null;
      closePathEditor();
      loadDir('.');
      $('st-status').textContent = '工作目录已切到 ' + d.cwd;
    }).catch(function (e) {
      alert('切换失败：' + e.message + '\n\n请检查路径是否存在。');
      sbInput.focus();
    });
  }

  sbPath.onclick = openPathEditor;
  sbInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); applyPathEditor(); }
    else if (e.key === 'Escape') { e.preventDefault(); closePathEditor(); }
  });
  sbInput.addEventListener('blur', function () {
    // 失焦时如果没在提交就关掉（延迟一点，免得抢在 Enter 之前）
    setTimeout(function () { if (sbEdit.style.display !== 'none') closePathEditor(); }, 150);
  });
  $('sb-up').onclick = function () {
    if (FS.rel === '.' || FS.rel === '') return;
    var parts = FS.rel.split('/');
    parts.pop();
    loadDir(parts.length ? parts.join('/') : '.');
  };
  $('sb-new').onclick = function () {
    var n = prompt('新文件名', '新程序.ding');
    if (!n) return;
    if (!/\.ding$/.test(n)) n += '.ding';
    var p = (FS.rel === '.' ? '' : FS.rel + '/') + n;
    api('/write', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: p, content: '# ' + n + '\n\nཔར("你好")\n' }),
    }).then(function () { loadDir(FS.rel); openFile(p); });
  };
  $('sb-saveas').onclick = function () { saveFile(true); };

  // ══════════════════════════════════════════════════════
  //  VS Code 风格活动栏
  // ══════════════════════════════════════════════════════
  document.querySelectorAll('.activitybar .act').forEach(function (b) {
    b.onclick = function () {
      var p = b.dataset.panel;
      if (p === 'files') {
        // 折叠 / 展开侧边栏
        var sb = $('sidebar');
        var hidden = sb.style.display === 'none';
        sb.style.display = hidden ? '' : 'none';
        var on = !hidden;
        b.classList.toggle('act-on', hidden);
        // 折叠时把网格的第一列留白去掉
        document.querySelector('main').style.gridTemplateColumns =
          hidden ? '48px 0 minmax(0,1fr)' : '';
      } else if (p === 'run') {
        run();
      } else if (p === 'ref') {
        window.open('reference.html', '_blank');
      }
    };
  });

  // 光标移动 → 更新行列号
  ['click', 'keyup', 'input', 'select'].forEach(function (evt) {
    codeEl.addEventListener(evt, updateStatusBar);
  });

  // 桌面模式下顶栏的「源码」标签改成文件名
  if (document.body.classList.contains('desktop')) {
    updateEditorTab();
    updateStatusBar();
  }
})();
</script>
</body>
</html>
